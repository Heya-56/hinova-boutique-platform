name = "hinova-boutique-platform"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Suspension automatique des boutiques impayées : chaque jour à 6h, heure de Tahiti (16h UTC)
[triggers]
crons = ["0 16 * * *"]

[vars]
ENVIRONMENT = "production"
BRAND = "Hinova Boutiques"
SUPPORT_EMAIL = "support@hinovadigitalcorp.com"
# Domaine racine des boutiques : <boutique>.ROOT_DOMAIN. Vide = adresses /b/<boutique> uniquement.
ROOT_DOMAIN = ""
# Hôte de l'application privée (générateur, tableau de bord, admin). Vide = tout sur un seul hôte (développement).
APP_HOST = ""
TRIAL_DAYS = "14"
GRACE_DAYS = "3"
# Adresses Google qui deviennent administratrices à leur première connexion (séparées par des virgules)
ADMIN_EMAILS = "heianui.tapare@hinovadigitalcorp.com"
# Prix Stripe des abonnements (compte Hinova Digital, XPF). Le paiement s'active dès que le secret STRIPE_SECRET_KEY est ajouté.
STRIPE_PRICE_PLAN_1_MENSUEL = "price_1UPSt7CVrYZbi1ZGTXRNPxD0"
STRIPE_PRICE_PLAN_1_ANNUEL = "price_1UPSt9CVrYZbi1ZGs2r5pMPW"
STRIPE_PRICE_PLAN_2_MENSUEL = "price_1UPStACVrYZbi1ZG8bFqdeE6"
STRIPE_PRICE_PLAN_2_ANNUEL = "price_1UPStCCVrYZbi1ZGWMbzWui5"
STRIPE_PRICE_PLAN_3_MENSUEL = "price_1UPStECVrYZbi1ZGhEXLuKU7"
STRIPE_PRICE_PLAN_3_ANNUEL = "price_1UPStFCVrYZbi1ZG47vRMHqJ"
# Option mensuelle PayZen (2 200 XPF/mois), lookup_key hb_option_payzen_mensuel
STRIPE_PRICE_OPTION_PAYZEN = "price_1UR31eCVrYZbi1ZGheJAKAPz"
# Option annuelle PayZen (20 000 XPF/an), lookup_key hb_option_payzen_annuel
STRIPE_PRICE_OPTION_PAYZEN_ANNUEL = "price_1UR3BCCVrYZbi1ZGXnBC8QZI"
# Secrets (tableau de bord Cloudflare ou npx wrangler secret put …) : STRIPE_SECRET_KEY (obligatoire pour encaisser),
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (connexion Google, facultative), STRIPE_WEBHOOK_SECRET (obligatoire).
# Le secret de session et le secret du webhook Stripe sont rangés dans la table config de la base.
# Ne JAMAIS définir DEV_LOGIN en production (connexion de test sans Google, réservée au poste local).

[[d1_databases]]
binding = "DB"
database_name = "hinova_boutiques"
database_id = "669366c5-aa8f-42c9-a8b7-d851928ec122"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "hinova-boutiques-images"

# Workers AI : rédaction des boutiques par le générateur (secours automatique si indisponible)
[ai]
binding = "AI"

# Environnement de test local (sans Workers AI, qui exige une connexion au compte) : npx wrangler dev --env test
[env.test]
[env.test.vars]
ENVIRONMENT = "test"
BRAND = "Hinova Boutiques"
SUPPORT_EMAIL = "support@hinovadigitalcorp.com"
ROOT_DOMAIN = ""
TRIAL_DAYS = "14"
GRACE_DAYS = "3"
ADMIN_EMAILS = "admin@test.pf"

[[env.test.d1_databases]]
binding = "DB"
database_name = "hinova_boutiques"
database_id = "669366c5-aa8f-42c9-a8b7-d851928ec122"
migrations_dir = "migrations"

[[env.test.r2_buckets]]
binding = "IMAGES"
bucket_name = "hinova-boutiques-images"
